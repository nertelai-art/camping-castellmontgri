name: CI

on:
  pull_request:
    branches: [developer]
  push:
    branches: [developer]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck/lint/tests ja han passat al pre-push; aquí només el que no es pot fer de fiar en local.
      - run: pnpm build
